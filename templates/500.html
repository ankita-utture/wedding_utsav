{% extends "base.html" %}

{% block title %}500 Server Error - Wedding Utsav{% endblock %}

{% block content %}
<div style="text-align: center; padding: 80px 20px; max-width: 600px; margin: 0 auto;">
    <div style="font-size: 80px; color: #A82E2E; margin-bottom: 20px;">
        <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h1 style="font-size: 32px; color: var(--royal-maroon); margin-bottom: 15px;">500 - Server Error</h1>
    <p style="font-size: 16px; color: var(--charcoal); opacity: 0.8; line-height: 1.6; margin-bottom: 30px;">
        Something went wrong on our end. Please try again or contact support if the issue persists.
    </p>
    <a href="{{ url_for('index') }}" class="btn-primary" style="display: inline-block; width: auto; padding: 12px 30px; text-decoration: none;">
        <i class="fa-solid fa-house"></i> Return to Dashboard
    </a>
</div>
{% endblock %}
